types {
  application/wasm wasm;
}

server {
  listen 8000;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml application/wasm text/plain;

  # Webcam is processed locally in the browser; allow camera for this origin only.
  add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Fingerprinted build assets: cache hard.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    try_files $uri =404;
  }

  # Large, rarely changing ML files.
  location ~* \.(wasm|task)$ {
    expires 7d;
    add_header Cache-Control "public";
    try_files $uri =404;
  }

  # SPA fallback.
  location / {
    add_header Cache-Control "no-cache";
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    try_files $uri $uri/ /index.html;
  }
}
